name: Build check

# Non-publishing validation only: on a pull request, confirm the electron-vite build still
# compiles, and nothing else. This workflow runs NO tests, NO type-check, and NO lint — see
# docs/ci-and-releases.md for the full policy. It does not gate anything: there is no
# `needs:` chain from here to release.yml, and merging is not conditioned on this workflow.
# It exists purely as fast, disposable feedback on a PR; a superseded push cancels the
# previous run outright, which is safe here precisely because this workflow never publishes
# anything.
#
# Pushes to main are not covered here on purpose — release.yml already builds (and
# publishes) on every push, so a second build of the same commit would be pure duplication.
on:
  pull_request:
    branches: [main]

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 shallow clone. The build runs
          # check-changelog.mjs, which verifies that every commit SHA linked from
          # CHANGELOG.md exists in the checkout -- in a shallow clone none of them do, so
          # this job reported 42 failures for commits that are all perfectly present on the
          # remote. release.yml already sets this for the same reason.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

  # Windows is becoming a supported target (extraction from #276). The full suite still contains
  # POSIX-shaped fixtures (/bin/sh, AF_UNIX binds), so this job runs the suites whose behaviour is
  # platform-dependent and worth proving on the real platform — the atomic-write retry exists FOR
  # Windows and is inert on the Linux job above. Widen the file list as Windows support lands
  # (session host, shell profiles); the goal is that it converges on `npm test`.
  quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build session host
        run: npm run host:build

      - name: Windows-relevant tests
        run: npx vitest run src/core/fs-atomic.test.ts src/core/fs-atomic.guard.test.ts src/session-host/ src/core/session-host-client.test.ts src/core/session-host-launch-ledger.test.ts src/core/agent-launch.test.ts src/core/pty-session-host.test.ts src/main/media-protocol.test.ts src/main/remote-atomic-write.test.ts src/main/ssh-fs.test.ts src/main/remote-ssh/ssh-project.test.ts src/renderer/terminal/file-links.test.ts src/renderer/terminal/file-links.windows.test.ts src/renderer/terminal/file-link-dialect.test.ts src/renderer/terminal/host-platform.test.ts
