name: Build check

# Non-publishing validation only: on a pull request, confirm the electron-vite build still
# compiles, and nothing else. This workflow runs NO tests, NO type-check, and NO lint — see
# docs/ci-and-releases.md for the full policy. It does not gate anything: there is no
# `needs:` chain from here to release.yml, and merging is not conditioned on this workflow.
# It exists purely as fast, disposable feedback on a PR; a superseded push cancels the
# previous run outright, which is safe here precisely because this workflow never publishes
# anything.
#
# Pushes to main are not covered here on purpose — release.yml already builds (and
# publishes) on every push, so a second build of the same commit would be pure duplication.
on:
  pull_request:
    branches: [main]

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default depth-1 shallow clone. The build runs
          # check-changelog.mjs, which verifies that every commit SHA linked from
          # CHANGELOG.md exists in the checkout -- in a shallow clone none of them do, so
          # this job reported 42 failures for commits that are all perfectly present on the
          # remote. release.yml already sets this for the same reason.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build
