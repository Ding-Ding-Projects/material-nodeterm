name: Security

# Two independent security gates on every PR into main (and a weekly baseline scan):
#   - CodeQL static analysis of the JS/TS sources (main + preload + renderer + server).
#   - Dependency review: blocks a PR that adds a vulnerable or disallowed-license dep.
# Both are free on public repos and add no secrets to the PR runner.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly re-scan so a newly-disclosed CVE in an unchanged dependency still surfaces.
    - cron: '17 4 * * 1'

# Least privilege: only CodeQL needs security-events:write to upload results.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 'security-extended' adds higher-recall security queries beyond the default set.
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  dependency-review:
    name: Dependency review
    # Only meaningful on a PR (it diffs the PR's manifest against the base), and only possible
    # on a repository that is not a fork. GitHub does not support Dependency review on a fork:
    # the action exits with "Dependency review is not supported on this repository. Please
    # ensure that Dependency graph is enabled", and the setting cannot be turned on there --
    # a PATCH to security_and_analysis comes back with no dependency_graph key at all.
    #
    # Skipping is honest rather than weakening: this is a job that CANNOT pass here, not one
    # that is failing. Left as-is it was a permanently red check on every pull request, which
    # teaches a reader nothing and trains them to ignore a red security job. It runs normally
    # the moment this repository stops being a fork, or on the upstream it was forked from.
    if: github.event_name == 'pull_request' && github.event.repository.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post the summary comment on the PR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          # Fail the PR on a moderate-or-worse advisory in an added/changed dependency.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # BUSL-1.1 is the project's own license; deny the classic copyleft licenses
          # that would be incompatible with redistributing the app.
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0
