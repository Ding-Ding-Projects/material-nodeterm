name: Release

# Governing policy — see docs/ci-and-releases.md for the full write-up:
#
#   This workflow runs NO tests and NO lint. Nothing in it gates the release: it BUILDS,
#   PACKAGES and PUBLISHES a GitHub Release, and that is the whole job. A run fails only
#   when the build, packaging, or publication itself fails.
#
# Windows is the active delivery target: the installer is built on windows-latest and is
# permanently UNSIGNED (code signing is out of scope for this project — see the "Package"
# step below). Every push and every manual dispatch publishes exactly one new, uniquely
# tagged, non-draft GitHub Release carrying the real built installer.
#
# Deliberately NO `concurrency: cancel-in-progress` group here — cancelling a run partway
# through publication could strand a tag with no artifact attached to it. That guard
# belongs on non-publishing validation workflows only (see ci.yml).
on:
  push:
    # BRANCHES ONLY — never tags. A bare `push:` also fires on tag pushes, and this workflow
    # CREATES a tag per release, so each release triggered the next one: v0.3.0-ci.2 published a
    # tag, that tag push started another run, which published v0.3.0-ci.3, and so on. It produced
    # 17 releases in half an hour before anyone looked. Keep this filter.
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release and upload its assets
  actions: read # read this run's own run_started_at for the release-notes timing section

jobs:
  release:
    runs-on: windows-latest
    # GH_TOKEN resolves once for every step in this job, in priority order: a repo-scoped
    # fine-grained PAT (if configured), then the org-wide token, then the workflow's own
    # ephemeral token as the guaranteed-available fallback. Never printed, logged, or
    # echoed — only ever read through the GH_TOKEN/GITHUB_TOKEN environment convention.
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the line-count report attributes surviving lines with `git
          # blame` across the whole tree, and the release-notes commit link wants the
          # real SHA regardless of shallow-clone default behavior.
          fetch-depth: 0

      - name: Record workflow start time
        id: timing
        shell: bash
        # Prefer GitHub's own `run_started_at` (the workflow run's first-job startedAt) so
        # the reported duration reflects real queue+run time, not just this step's wall
        # clock. Fails open to "unknown" — release-notes.mjs reports a missing start time
        # honestly rather than estimating one.
        run: |
          started_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -z "$started_at" ] || [ "$started_at" = "null" ]; then
            echo "::warning::could not read run_started_at from the GitHub API; release notes will report the workflow start time as missing"
            echo "started_at=" >> "$GITHUB_OUTPUT"
          else
            echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Bootstraps everything `npm ci` needs: locked npm dependencies, plus the postinstall
      # hook's own bootstrap (scripts/patch-node-pty.mjs + `electron-rebuild -f -w
      # node-pty,smart-whisper` against this runner's Electron ABI). windows-latest already
      # ships the Visual Studio Build Tools + Python that native module compilation needs
      # (part of the standard GitHub-hosted Windows runner image), so nothing extra is
      # installed here. If a future dependency needs a tool the image doesn't carry, this
      # step is where to add the missing bootstrap — check for it, install only if absent.
      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run make-icon

      - name: Build (electron-vite)
        run: npm run build

      - name: Compute release tag
        id: tag
        shell: bash
        run: |
          # Monotonic: package.json's version plus this workflow's own run number, which
          # GitHub guarantees increases on every run of this workflow and never repeats —
          # so no two runs can ever collide on a tag, and no prior release is recycled,
          # even across re-runs of the exact same commit.
          base="v$(node -p "require('./package.json').version")"
          tag="${base}-ci.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Unsigned, permanently. No CSC_LINK/CSC_KEY_PASSWORD is ever set in this workflow, so
      # electron-builder has no certificate to sign with in the first place;
      # CSC_IDENTITY_AUTO_DISCOVERY=false additionally stops it from opportunistically
      # picking one up from the runner's own certificate store, and package.json's
      # `build.forceCodeSigning: false` (the documented default) means a build never aborts
      # over a signing step it was never asked to perform. The next step independently
      # verifies the produced installer's real Authenticode signature and fails the run if
      # it is somehow signed — belt and braces, not just a documented intent.
      - name: Package Windows installer (Squirrel, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never

      - name: Locate release assets and verify unsigned
        id: assets
        shell: pwsh
        run: |
          # electron-builder's Squirrel target writes Setup.exe, RELEASES, and the full
          # .nupkg (plus a delta .nupkg on a repeat version) under dist/squirrel-windows/.
          $dir = 'dist/squirrel-windows'
          if (-not (Test-Path $dir)) {
            Write-Error "expected Squirrel output directory '$dir' was not produced"
            exit 1
          }
          $files = Get-ChildItem -Path $dir -File | Where-Object {
            $_.Name -like '*-Setup-*.exe' -or $_.Name -eq 'RELEASES' -or $_.Extension -eq '.nupkg'
          }
          if (-not $files) {
            Write-Error "no installer/RELEASES/.nupkg files found under $dir"
            exit 1
          }

          $setup = $files | Where-Object { $_.Name -like '*-Setup-*.exe' } | Select-Object -First 1
          if (-not $setup) {
            Write-Error "no Setup.exe found among the packaged Squirrel assets"
            exit 1
          }
          $sig = Get-AuthenticodeSignature -FilePath $setup.FullName
          Write-Host "Signature status for $($setup.Name): $($sig.Status)"
          if ($sig.Status -eq 'Valid') {
            Write-Error "the packaged installer is SIGNED — this project permanently prohibits code signing; failing the release"
            exit 1
          }

          $paths = $files | ForEach-Object { $_.FullName }
          Write-Host "Release assets:"
          $paths | ForEach-Object { Write-Host "  $_" }
          # Multi-line GITHUB_OUTPUT value (also fed to release-notes.mjs verbatim).
          $delim = "EOF_ASSETS_$([guid]::NewGuid().ToString('N'))"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "paths<<$delim"
          $paths | ForEach-Object { Add-Content -Path $env:GITHUB_OUTPUT -Value $_ }
          Add-Content -Path $env:GITHUB_OUTPUT -Value $delim

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          WORKFLOW_STARTED_AT: ${{ steps.timing.outputs.started_at }}
          RELEASE_ASSET_PATHS: ${{ steps.assets.outputs.paths }}
        run: |
          # WORKFLOW_COMPLETED_AT is left unset on purpose: release-notes.mjs stamps its
          # own "now" (UTC) the moment it runs, which is right here — immediately before
          # publication, i.e. through the final release-publication step for this
          # single-job workflow. Nothing meaningful happens between this timestamp and
          # the release actually going live below.
          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          echo "notes_path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Idempotent: GITHUB_RUN_NUMBER (part of the tag) stays fixed across a re-run of
          # this same workflow run, so a retry after a partial failure (release created,
          # asset upload interrupted) must reuse the existing release rather than fail on
          # "tag already exists". `gh release edit` refreshes the notes in that case so a
          # retry's notes (real duration, real line count at this commit) still win.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "${{ steps.notes.outputs.notes_path }}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "${{ steps.notes.outputs.notes_path }}" \
              --target "$GITHUB_SHA"
          fi

      - name: Upload release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          ASSET_PATHS: ${{ steps.assets.outputs.paths }}
        run: |
          # --clobber makes a retry of this step idempotent if a prior attempt uploaded
          # some but not all assets (network blip mid-upload, runner hiccup, etc.).
          echo "$ASSET_PATHS" | while IFS= read -r path; do
            [ -n "$path" ] || continue
            gh release upload "$RELEASE_TAG" "$path" --clobber --repo "$GITHUB_REPOSITORY"
          done

      # Runs even when an earlier step failed, so a broken build still leaves something to
      # inspect. Never uploads credentials, node_modules, caches, or the source tree — only
      # the packaged output and the generated release notes. `continue-on-error` on both
      # the collection and the upload keeps artifact handling from masking (or reversing)
      # the real pass/fail verdict of the steps above it.
      - name: Collect build artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-out"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "job_status=$JOB_STATUS"
            echo "runner_os=$RUNNER_OS"
          } > "$RUNNER_TEMP/artifact-out/run-context.txt"
          if [ -d dist/squirrel-windows ]; then
            cp -r dist/squirrel-windows "$RUNNER_TEMP/artifact-out/squirrel-windows" || true
          fi
          if [ -f "$RUNNER_TEMP/notes.md" ]; then
            cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/artifact-out/release-notes.md" || true
          fi
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload build artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_number }}
          path: ${{ runner.temp }}/artifact-out
          if-no-files-found: warn
          retention-days: 14
