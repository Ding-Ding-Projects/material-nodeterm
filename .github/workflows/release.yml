name: Release

# Governing policy — see docs/ci-and-releases.md for the full write-up:
#
#   This workflow runs NO tests, type-check or lint. Nothing in it gates the release: it
#   BUILDS, PACKAGES and PUBLISHES a GitHub Release, and that is the whole job. A run fails
#   only when the build, packaging, or publication itself fails.
#
# Windows is the active delivery target: the installer is built on windows-latest and is
# permanently UNSIGNED (code signing is out of scope for this project — see the "Package"
# step below). Every branch push and every manual dispatch owns one unique tag. Its release
# stays a DRAFT while assets upload and becomes public only after the complete remote
# Squirrel set has been verified.
#
# Distinct pushes may build concurrently. Attempts of the SAME run share a group and are
# never cancelled: cancellation between draft creation and publication would leave work for
# a retry, while a repository-wide group would silently discard queued pushes (GitHub keeps
# only one pending member per concurrency group).
on:
  push:
    # BRANCHES ONLY — never tags. A bare `push:` also fires on tag pushes, and this workflow
    # CREATES a tag per release, so each release triggered the next one: v0.3.0-ci.2 published a
    # tag, that tag push started another run, which published v0.3.0-ci.3, and so on. A run
    # triggered by a tag checks out and executes *that tag's own copy* of this file, so early
    # fixes on `main` could not stop runs already replaying against older tags — only manually
    # disabling the whole workflow in GitHub Actions did. By the time it was disabled, `gh
    # release list` showed 43 tagged releases and `gh run list --workflow=release.yml` showed 85
    # runs (all failure/cancelled — none reached the packaging step cleanly) spanning about an
    # hour. Keep this filter.
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.run_number }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release and upload its assets
  actions: read # read this run's own run_started_at for the release-notes timing section

jobs:
  release:
    # GitHub also emits `push` when a branch is deleted. That event carries no deleted
    # commit to package and can fall back to the default branch's HEAD, so it must not
    # manufacture a duplicate release.
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: windows-latest
    steps:
      # Second line of defense against the exact loop this workflow already caused once
      # (see the `on.push.branches` comment above and docs/ci-and-releases.md): this
      # workflow PUBLISHES a tag every time it runs, so a run triggered by a TAG push
      # would trigger the next run, which publishes the next tag, forever. The branch
      # filter is the primary fix, but a run triggered by a tag checks out and executes
      # *that tag's* copy of this file — so a future edit that loosens only the trigger or
      # a manual `workflow_dispatch` aimed at a tag ref is still stopped, provided that ref's
      # copy contains this guard. Truly old copies without the guard require disabling the
      # workflow or updating/removing those refs. This step is cheap (no checkout, no
      # dependencies) and fails before anything expensive.
      - name: Refuse to run against a tag ref (release-loop guard)
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          echo "::error::This workflow must never run against a tag ref (got ref_type=tag, ref=${GITHUB_REF}). This workflow publishes a tag on every run, so a tag-triggered run re-enters the exact publish loop described in docs/ci-and-releases.md. Refusing to continue."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the line-count report attributes surviving lines with `git
          # blame` across the whole tree, and the release-notes commit link wants the
          # real SHA regardless of shallow-clone default behavior.
          fetch-depth: 0
          # Do not leave the contents-write token in git config for npm/build subprocesses.
          persist-credentials: false

      - name: Record workflow start time
        id: timing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # Prefer GitHub's own `run_started_at` (the workflow run's first-job startedAt) so
        # the reported duration reflects real queue+run time, not just this step's wall
        # clock. Fails open to "unknown" — release-notes.mjs reports a missing start time
        # honestly rather than estimating one.
        run: |
          started_at=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at 2>/dev/null || true)
          if [ -z "$started_at" ] || [ "$started_at" = "null" ]; then
            echo "::warning::could not read run_started_at from the GitHub API; release notes will report the workflow start time as missing"
            echo "started_at=" >> "$GITHUB_OUTPUT"
          else
            echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Bootstraps everything `npm ci` needs: locked npm dependencies, plus the postinstall
      # hook's own bootstrap (scripts/patch-node-pty.mjs + `electron-rebuild -f -w
      # node-pty,smart-whisper` against this runner's Electron ABI). windows-latest already
      # ships the Visual Studio Build Tools + Python that native module compilation needs
      # (part of the standard GitHub-hosted Windows runner image), so nothing extra is
      # installed here. If a future dependency needs a tool the image doesn't carry, this
      # step is where to add the missing bootstrap — check for it, install only if absent.
      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run make-icon

      - name: Build (electron-vite)
        run: npm run build

      - name: Compute release tag
        id: tag
        shell: bash
        run: |
          # Monotonic: package.json's version plus this workflow's own run number, which
          # GitHub guarantees increases on every run of this workflow and never repeats —
          # so no two runs can ever collide on a tag, and no prior release is recycled,
          # even across re-runs of the exact same commit.
          base="v$(node -p "require('./package.json').version")"
          tag="${base}-ci.${GITHUB_RUN_NUMBER}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Unsigned, permanently. No CSC_LINK/CSC_KEY_PASSWORD is ever set in this workflow, so
      # electron-builder has no certificate to sign with in the first place;
      # CSC_IDENTITY_AUTO_DISCOVERY=false additionally stops it from opportunistically
      # picking one up from the runner's own certificate store. package.json's Windows
      # `signExecutable: false` is the explicit no-sign control while resource editing stays
      # enabled; `forceCodeSigning: false` additionally permits unsigned output. The next
      # step independently verifies the produced installer's real Authenticode signature and
      # fails the run if it is somehow signed — belt and braces, not just documented intent.
      - name: Package Windows installer (Squirrel, unsigned)
        id: package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win squirrel --x64 --publish never

      - name: Validate complete Squirrel asset set
        id: assets
        shell: bash
        # This checks all three required kinds independently and proves RELEASES' SHA-1/name/size
        # records actually describe the .nupkg files being uploaded. "Some files exist" is not a
        # complete Squirrel release.
        run: node scripts/release-assets.mjs collect dist/squirrel-windows

      - name: Verify installer is genuinely unsigned
        id: unsigned
        shell: pwsh
        env:
          SETUP_PATH: ${{ steps.assets.outputs.setup }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath $env:SETUP_PATH
          Write-Host "Signature status for ${env:SETUP_PATH}: $($sig.Status)"
          node scripts/release-assets.mjs assert-unsigned "$($sig.Status)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage exactly one draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_ASSET_MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: |
          # A successful rerun must not clobber public assets. If this run already published a
          # complete release, validate it and finish idempotently. An interrupted attempt leaves a
          # draft, which is safe to edit and replace because nobody can download it as a release.
          if state=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$state" = "false" ]; then
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,tagName,targetCommitish > "$RUNNER_TEMP/existing-release.json"
              tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
              node scripts/release-assets.mjs assert-target "$tag_sha" "$GITHUB_SHA"
              node scripts/release-assets.mjs verify "$RUNNER_TEMP/existing-release.json" published exact
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --notes "Assets are being staged by GitHub Actions. This draft is not a published release."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --notes "Assets are being staged by GitHub Actions. This draft is not a published release."
          fi
          echo "already_published=false" >> "$GITHUB_OUTPUT"

      - name: Upload assets to draft
        id: upload
        if: steps.draft.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          ASSET_PATHS: ${{ steps.assets.outputs.paths }}
          RELEASE_ASSET_MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: |
          # One direct gh invocation: failure stops this step and the release remains a draft.
          # Prune leftovers from an older failed attempt first, so exact verification can converge;
          # --clobber is safe here because it can only replace invisible draft assets.
          declare -A expected=()
          while IFS= read -r name; do
            name="${name%$'\r'}"
            [ -n "$name" ] && expected["$name"]=1
          done < <(node -e 'const m=JSON.parse(process.env.RELEASE_ASSET_MANIFEST); for (const a of m.assets) console.log(a.name)')
          while IFS= read -r name; do
            name="${name%$'\r'}"
            if [ -n "$name" ] && [ -z "${expected[$name]+present}" ]; then
              gh release delete-asset "$RELEASE_TAG" "$name" --yes --repo "$GITHUB_REPOSITORY"
            fi
          done < <(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')

          mapfile -t assets < <(printf '%s\n' "$ASSET_PATHS" | sed 's/\r$//' | sed '/^$/d')
          if [ "${#assets[@]}" -lt 3 ]; then
            echo "::error::the validated release asset list unexpectedly became incomplete"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Generate final release notes
        id: notes
        if: steps.draft.outputs.already_published != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          WORKFLOW_STARTED_AT: ${{ steps.timing.outputs.started_at }}
          RELEASE_ASSET_PATHS: ${{ steps.assets.outputs.paths }}
        run: |
          # RELEASE_NOTES_GENERATED_AT is left unset on purpose: release-notes.mjs stamps its
          # own "now" after the potentially slow upload. It labels that boundary honestly;
          # verification and publication still happen afterward.
          node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          echo "notes_path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Verify draft and publish once
        id: publish
        if: steps.draft.outputs.already_published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_ASSET_MANIFEST: ${{ steps.assets.outputs.manifest }}
        run: |
          # Keep the notes edit explicitly draft. Only the command after an exact remote
          # name+size comparison may cross the public boundary.
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --notes-file "${{ steps.notes.outputs.notes_path }}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,tagName,targetCommitish > "$RUNNER_TEMP/draft-release.json"
          node scripts/release-assets.mjs verify "$RUNNER_TEMP/draft-release.json" draft exact

          # A draft may not have created its tag yet. If the ref exists, however, it must point
          # at this exact commit before publication; only a confirmed 404 means "not created".
          # A network/auth failure is not evidence of absence and must stop the transaction.
          if tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha 2>"$RUNNER_TEMP/tag-ref-error.txt"); then
            node scripts/release-assets.mjs assert-target "$tag_sha" "$GITHUB_SHA"
          elif grep -Eq '\(HTTP 404\)$' "$RUNNER_TEMP/tag-ref-error.txt"; then
            echo "Tag does not exist yet; GitHub will create it from the verified draft target."
          else
            cat "$RUNNER_TEMP/tag-ref-error.txt" >&2
            exit 1
          fi

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

          # The pre-publication check is the safety boundary. This post-check proves the state
          # transition did not change the inventory; if the API read fails, the run is red while
          # the already-verified complete release remains safe and retryable.
          tag_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)
          node scripts/release-assets.mjs assert-target "$tag_sha" "$GITHUB_SHA"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets,tagName,targetCommitish > "$RUNNER_TEMP/published-release.json"
          node scripts/release-assets.mjs verify "$RUNNER_TEMP/published-release.json" published exact

      # Runs even when an earlier step failed, so a broken build still leaves something to
      # inspect. Never uploads credentials, node_modules, caches, or the source tree — only
      # the packaged output and the generated release notes. `continue-on-error` on both
      # the collection and the upload keeps artifact handling from masking (or reversing)
      # the real pass/fail verdict of the steps above it.
      - name: Collect build artifacts
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-out"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "job_status=$JOB_STATUS"
            echo "runner_os=$RUNNER_OS"
          } > "$RUNNER_TEMP/artifact-out/run-context.txt"
          if [ -d dist/squirrel-windows ]; then
            cp -r dist/squirrel-windows "$RUNNER_TEMP/artifact-out/squirrel-windows" || true
          fi
          if [ -f "$RUNNER_TEMP/notes.md" ]; then
            cp "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/artifact-out/release-notes.md" || true
          fi
        env:
          JOB_STATUS: ${{ job.status }}

      - name: Upload build artifacts
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-out
          if-no-files-found: warn
          retention-days: 14
