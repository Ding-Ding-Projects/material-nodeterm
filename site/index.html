<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nodeterm — the terminal playground</title>
    <meta
      name="description"
      content="nodeterm: multiple real terminals as draggable blocks on one giant canvas. This page is a playful, no-jargon tour of everything it can do — search everything, build a regex, right-click anything."
    />
    <!--
      What a pasted link looks like in Discord, Slack, iMessage and everywhere else that unfurls.
      Four of these tags are load-bearing and easy to get wrong:

        og:image MUST be an absolute https URL. A relative path is the single commonest reason
        an embed renders with no picture, and it fails silently — the tag is right there in the
        source, so it looks done. The URL is hardcoded to the deployed origin because a static
        page has no way to compute one; if the site ever moves, this line moves with it.

        twitter:card = summary_large_image is what decides between a BIG picture and a thumbnail
        squeezed next to the text. Discord honours it, despite the name.

        og:image:width/height let the card render at full size immediately instead of waiting
        for the crawler to measure the file.

        og:image:alt reaches people using a screen reader, who get an embed too.

      The image itself is generated by scripts/make-social-card.mjs from a REAL capture of the
      built app, never a mockup. Crawlers cache an image URL hard, so a meaningful redesign of
      the card wants a new FILENAME rather than an overwrite nobody downstream will notice.
    -->
    <meta property="og:site_name" content="nodeterm" />
    <meta property="og:title" content="nodeterm — the terminal playground" />
    <meta
      property="og:description"
      content="Real terminals and coding agents as live nodes on one canvas. Pan, zoom, and pick up exactly where you left off — even after a reboot."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ding-ding-projects.github.io/material-nodeterm/" />
    <meta
      property="og:image"
      content="https://ding-ding-projects.github.io/material-nodeterm/assets/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The nodeterm desktop app: a terminal window sitting as a node on a dark dotted canvas, with a sessions panel listing the open project."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="nodeterm — the terminal playground" />
    <meta
      name="twitter:description"
      content="Real terminals and coding agents as live nodes on one canvas."
    />
    <meta
      name="twitter:image"
      content="https://ding-ding-projects.github.io/material-nodeterm/assets/social-card.png"
    />
    <meta name="theme-color" content="#ffd93d" />
    <link rel="icon" href="./assets/nodeterm.png" />
    <link rel="stylesheet" href="./styles.css" />
    <!--
      Theme is applied BEFORE first paint (inline, blocking) so a returning
      visitor with a saved day/night preference never sees a flash of the
      wrong palette. No external script, no analytics, no CDN — this file,
      styles.css, and the ./app/ ES modules are this page's entire
      client-side footprint, and everything in ./app/ runs from this
      origin only.
    -->
    <script>
      ;(function () {
        try {
          var saved = JSON.parse(localStorage.getItem('nodeterm-playground.v1') || '{}')
          if (saved && saved.theme === 'night') document.documentElement.setAttribute('data-theme', 'night')
          if (saved && saved.bigText) {
            document.documentElement.style.fontSize = '19px'
          }
        } catch (_err) {
          /* localStorage unavailable (private mode, etc.) — falls back to the day palette */
        }
      })()
    </script>
  </head>
  <body>
    <a class="skip-link" href="#app-root">Skip to content</a>
    <div id="app-root" role="main">
      <!-- The whole page (hallway + rooms + dialogs + toasts) is rendered
           here by ./app/main.js. Nothing else needs to be authored in
           this file — see app/core/render.js. -->
      <noscript>
        <div style="padding: 40px; max-width: 640px; margin: 0 auto; font-family: sans-serif">
          <h1>nodeterm</h1>
          <p>
            This page needs JavaScript to run — it is a small local app (search, a regex
            builder, a command palette, games, a built-in authenticator, and more), not a
            static article. Nothing here ever leaves your browser.
          </p>
          <p><a href="https://github.com/Ding-Ding-Projects/material-nodeterm">View the project on GitHub</a></p>
        </div>
      </noscript>
    </div>
    <script type="module" src="./app/main.js"></script>
  </body>
</html>
