<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Narrow width and high scale</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./v3.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0}
a{color:#87D6BC}a:hover{color:#A3F2D7}
</style>
</helmet>
<div class="v3" style="width: 1440px; height: 1000px; display: flex; gap: 32px; padding: 40px; background: var(--md-surface-container-lowest); overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
    <figcaption class="label-l muted">480 px window · rail becomes a bottom bar</figcaption>
    <div style="width: 480px; height: 880px; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; background: var(--md-surface); box-shadow: inset 0 0 0 1px var(--md-outline-variant)">
      <header class="titlebar"><span class="msr fill" style="color: var(--md-primary)">hub</span><button class="btn tonal xs sl" style="height: 32px">material-nodeterm<span class="msr" style="font-size: 18px">arrow_drop_down</span></button><button class="ibtn sm sl" aria-label="Search" style="margin-left: auto"><span class="msr">search</span></button><div class="wctl" style="margin-left: 0"><button class="sl" aria-label="Minimize"><span class="msr">remove</span></button><button class="sl" aria-label="Close window"><span class="msr">close</span></button></div></header>
      <div style="flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 10px; background-image: radial-gradient(var(--canvas-dot) 1.2px, transparent 1.4px); background-size: 24px 24px">
        <section class="node focus" style="height: 280px"><div class="hd"><span class="dot live" style="background: var(--md-success); color: var(--md-success)"></span><span class="title-s">Claude Code · auth</span></div><div class="bd"><div>● Updating token refresh</div><div class="caret" style="margin-top: 6px">✻ Thinking</div></div></section>
        <section class="node needs" style="height: 170px"><div class="hd"><span class="title-s">Codex · migrations</span><span class="chip on" style="height: 24px; font-size: 11px; margin-left: auto">Needs you</span></div><div class="bd" style="display: flex; flex-direction: column; gap: 8px"><span>Run db:migrate?</span><div style="display: flex; gap: 6px; flex-wrap: wrap"><button class="btn filled xs sl">Approve</button><button class="btn outlined xs sl" style="color: var(--term-fg)">Deny</button></div></div></section>
      </div>
      <nav style="height: 80px; display: flex; justify-content: space-around; align-items: center; background: var(--md-surface-container)" aria-label="Destinations">
        <button class="ri on sl" style="width: 72px"><span class="pill" style="width: 64px"><span class="msr fill">workspaces</span></span>Canvas</button>
        <button class="ri sl" style="width: 72px"><span class="pill"><span class="msr">view_kanban</span></span>Board</button>
        <button class="ri sl" style="width: 72px"><span class="pill"><span class="msr">construction</span></span>Tools</button>
        <button class="ri sl" style="width: 72px"><span class="pill"><span class="msr">more_horiz</span></span>More</button>
      </nav>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0">
    <figcaption class="label-l muted">200% scale · bilingual · longest strings wrap, never clip</figcaption>
    <div style="border-radius: 20px; background: var(--md-surface); box-shadow: inset 0 0 0 1px var(--md-outline-variant); padding: 24px; display: flex; flex-direction: column; gap: 16px; zoom: 1.6">
      <div class="li" style="border-radius: 20px; align-items: flex-start; padding: 12px 16px"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span class="title-s">Automatically install node dependencies</span><span class="title-s" style="color: var(--md-primary)">自動幫節點安裝晒啲依賴套件</span><span class="body-s muted">Runs the project's own install command when a node needs it.</span></div><span class="switch on" role="img" aria-label="On" style="margin-top: 4px"></span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn filled sl">Restart to install update · 重啟安裝更新</button><button class="btn text sl">Later · 遲啲先</button></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: auto">
      <div class="card filled" style="border-radius: 20px; display: flex; flex-direction: column; gap: 4px"><span class="label-m muted">100%</span><span class="body-s">targets 40 px</span></div>
      <div class="card filled" style="border-radius: 20px; display: flex; flex-direction: column; gap: 4px"><span class="label-m muted">125%</span><span class="body-s">targets 50 px</span></div>
      <div class="card filled" style="border-radius: 20px; display: flex; flex-direction: column; gap: 4px"><span class="label-m muted">150%</span><span class="body-s">tabs scroll, labels stay</span></div>
      <div class="card filled" style="border-radius: 20px; display: flex; flex-direction: column; gap: 4px"><span class="label-m muted">200%</span><span class="body-s">rail collapses to icons + tooltips</span></div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
